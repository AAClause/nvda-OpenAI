# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

# Bundled with prek: no clone, no Python environment.
[[repos]]
repo = "builtin"
hooks = [
  { id = "check-case-conflict" },
  { id = "check-yaml" },
  { id = "check-toml" },
]

# ruff comes from the uv environment (lint group), so uv.lock pins its version;
# its rules are in pyproject.toml ([tool.ruff]). It also reports syntax errors.
[[repos]]
repo = "local"
hooks = [
  { id = "ruff-check", name = "ruff check", entry = "uv run ruff check", language = "system", pass_filenames = false, files = '(\.py|^sconstruct)$' },
]
