# Development environment only: the add-on itself is built with scons and
# bundled with NVDA's own Python, not installed as a package.
[project]
name = "nvda-aihub"
version = "0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
test = ["pytest>=8"]
# sconstruct runs `python -m pip download` to vendor wheels into addon/.../libs.
build = ["scons", "markdown", "pip"]
lint = ["prek"]

[tool.uv]
package = false
default-groups = "all"

[tool.ruff]
target-version = "py311"
line-length = 150
extend-exclude = ["addon/globalPlugins/AIHub/libs"]
extend-include = ["sconstruct"]
# NVDA installs the gettext functions as builtins (addonHandler.initTranslation).
builtins = ["_", "ngettext", "pgettext", "npgettext"]

[tool.ruff.lint]
# Bug finders only (pyflakes, syntax and runtime errors, bugbear); no style rules.
select = ["F", "E9", "B", "PLE"]
# Empty methods in ChromeSection are optional hooks, not missing abstract methods.
ignore = ["B027"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
